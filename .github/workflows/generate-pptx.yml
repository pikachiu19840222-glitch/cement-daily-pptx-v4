
name: Generate Cement Daily PPTX V4


on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "施工日期"
        required: false
        type: string
      project_name:
        description: "工程名稱"
        required: false
        type: string
      contractor:
        description: "施工單位"
        required: false
        type: string
      workers:
        description: "施工人數"
        required: false
        type: string
      managers:
        description: "管理人數"
        required: false
        type: string
      work_content:
        description: "施工內容"
        required: false
        type: string


permissions:
  contents: write
  actions: read

concurrency:
  group: cement-daily-release
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install


      - name: Generate PPTX
        env:
          REPORT_DATE: ${{ inputs.report_date }}
          PROJECT_NAME: ${{ inputs.project_name }}
          CONTRACTOR: ${{ inputs.contractor }}
          WORKERS: ${{ inputs.workers }}
          MANAGERS: ${{ inputs.managers }}
          WORK_CONTENT: ${{ inputs.work_content }}
        run: npm run generate


      - name: Verify PPTX file
        run: |
          test -s daily_report.pptx
          echo "PPTX generated successfully"
          ls -lh daily_report.pptx

      - name: Upload PPTX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cement-daily-report
          path: daily_report.pptx
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          TAG="daily-report-latest"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists"
          else
            gh release create "$TAG" \
              --title "Cement Daily Report - Latest" \
              --notes "Latest generated construction report." \
              --target "$GITHUB_SHA" \
              --latest
          fi

          gh release upload "$TAG" \
            daily_report.pptx \
            --clobber

          echo "Release upload completed"

      - name: Show PPTX download URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view daily-report-latest \
            --json assets \
            --jq '.assets[] | select(.name=="daily_report.pptx") | .url'
